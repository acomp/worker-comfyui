name: Build MiniMax H3 ref-to-video image

# Bakes the minimaxh3 image (MiniMax H3 reference-to-video stack:
# diffusion model + video/audio VAEs + Qwen3-VL-32B text encoder +
# optional 4-step turbo LoRA, all from Comfy-Org/MiniMax-H3 on
# HuggingFace) so the ref2va workflow JSON can be submitted to the worker.
#
# NOTE: this workflow runs on a SELF-HOSTED runner (the ~61GB image cannot
# be exported on GitHub's free hosted runners: disk too small).
# One-time Mac setup (Apple Silicon):
# 1. Install Docker Desktop for Mac (ARM64).
# 2. Docker Desktop > Settings > General: enable
#    "Use Rosetta for x86_64/amd64 emulation".
# 3. Docker Desktop > Settings > Resources: set "Virtual disk limit" to
#    at least 150 GB (the build needs ~120 GB; default 64 GB is too small).
# 4. Make sure the Mac has ~130 GB free disk space.
# 5. Repo > Settings > Actions > Runners > New self-hosted runner > macOS
#    ARM64, then run the shown ./config.sh / ./run.sh (or ./svc.sh
#    install + start) on the Mac. Keep the Mac awake during the build.
# 6. After the image is pushed, remove the runner.
#
# Prerequisites in the fork (one-time, already done):
# 1. Settings > Actions > General: enable "Allow all actions and reusable workflows"
# 2. Settings > Secrets and variables > Actions:
#    - Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#    - Variables: DOCKERHUB_REPO (e.g. acomp), DOCKERHUB_IMG (e.g. worker-comfyui)
#
# The produced tag is: <DOCKERHUB_REPO>/<DOCKERHUB_IMG>:<version>
# (default version "minimaxh3-ref-to-video").

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag version (e.g. minimaxh3-ref-to-video)"
        required: false
        default: "minimaxh3-ref-to-video"
        type: string

jobs:
  build-minimaxh3:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set environment variables
        run: |
          echo "DOCKERHUB_REPO=${{ vars.DOCKERHUB_REPO }}" >> $GITHUB_ENV
          echo "DOCKERHUB_IMG=${{ vars.DOCKERHUB_IMG }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Build and push minimaxh3 image
        uses: docker/bake-action@v2
        with:
          push: true
          targets: minimaxh3
          set: |
            *.args.DOCKERHUB_REPO=${{ env.DOCKERHUB_REPO }}
            *.args.DOCKERHUB_IMG=${{ env.DOCKERHUB_IMG }}
            *.args.RELEASE_VERSION=${{ env.RELEASE_VERSION }}
