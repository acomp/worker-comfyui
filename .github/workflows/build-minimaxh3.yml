name: Build MiniMax H3 ref-to-video image

# Two-phase build for the ~61GB minimaxh3 image, adapted from
# vincezh2000/minimax-h3-comfyui-serverless:
#
# Phase 1: `docker build` a SLIM image (ComfyUI + deps, no weights, ~17GB)
#          and push it as <version>-code. Fits on a free GitHub runner.
# Phase 2: stream each of the 5 MiniMax H3 weight files (~44GB total) onto it
#          as an image layer with `crane append`. Peak disk = one weight file
#          + its tar. A naive single `docker build` with the weights baked in
#          needs ~2x the weight size on disk during export and dies with
#          "no space left on device" on free runners (seen 2026-10-01).
#
# Prerequisites in the fork (one-time, already done):
# 1. Settings > Actions > General: enable "Allow all actions and reusable workflows"
# 2. Settings > Secrets and variables > Actions:
#    - Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#    - Variables: DOCKERHUB_REPO (e.g. acomp), DOCKERHUB_IMG (e.g. worker-comfyui)
#
# The produced tag is: <DOCKERHUB_REPO>/<DOCKERHUB_IMG>:<version>
# (default version "minimaxh3-ref-to-video").

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag version (e.g. minimaxh3-ref-to-video)"
        required: false
        default: "minimaxh3-ref-to-video"
        type: string

jobs:
  build-minimaxh3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set environment variables
        run: |
          echo "DOCKERHUB_REPO=${{ vars.DOCKERHUB_REPO }}" >> $GITHUB_ENV
          echo "DOCKERHUB_IMG=${{ vars.DOCKERHUB_IMG }}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${{ inputs.version }}" >> $GITHUB_ENV

      - name: Build and push slim image (no weights)
        uses: docker/bake-action@v2
        with:
          push: true
          targets: minimaxh3
          set: |
            *.args.DOCKERHUB_REPO=${{ env.DOCKERHUB_REPO }}
            *.args.DOCKERHUB_IMG=${{ env.DOCKERHUB_IMG }}
            *.args.RELEASE_VERSION=${{ env.RELEASE_VERSION }}
            *.args.INCLUDE_MINIMAXH3_MODELS=false
            *.tags=${{ env.DOCKERHUB_REPO }}/${{ env.DOCKERHUB_IMG }}:${{ env.RELEASE_VERSION }}-code

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # Stream each weight file onto the slim image as its own layer.
      # crane talks directly to the registry: the ~61GB image is never
      # assembled on the runner's disk.
      - name: Append MiniMax H3 weight layers with crane
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          crane auth login index.docker.io -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
          WORK=/mnt/weights
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          IMG="$DOCKERHUB_REPO/$DOCKERHUB_IMG"
          BASE="$IMG:$RELEASE_VERSION-code"
          HF=https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main
          append() { # $1 = models subdir, $2 = filename
            mkdir -p "$WORK/stage/comfyui/models/$1"
            aria2c -x16 -s16 -k1M --console-log-level=warn \
              --dir="$WORK/stage/comfyui/models/$1" -o "$2" "$HF/$1/$2"
            tar --owner=0 --group=0 -cf "$WORK/layer.tar" -C "$WORK/stage" comfyui
            rm -rf "$WORK/stage"
            crane append -b "$BASE" -f "$WORK/layer.tar" -t "$IMG:wip"
            rm -f "$WORK/layer.tar"
            BASE="$IMG:wip"
            df -h /mnt | tail -1
          }
          append vae minimax_h3_video_vae_fp16.safetensors
          append vae minimax_h3_audio_vae_fp32.safetensors
          append diffusion_models minimax_h3_ref2va_pruned_int8_convrot.safetensors
          append text_encoders qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
          append loras minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors
          crane tag "$IMG:wip" "$RELEASE_VERSION"
